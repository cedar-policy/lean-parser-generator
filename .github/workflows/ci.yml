
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copyright:
    name: Check copyright notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-copyright.sh --all

  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: lake --version
      # Default targets: the generator, the language server, and VerifiedSmoke
      # (calc proofs, lexer/parser roundtrips). VerifiedMid and VerifiedHeavy are
      # not built here; they are minutes-to-hours of native_decide.
      - name: Build default targets (includes VerifiedSmoke)
        run: lake build
      # Build the runtime library's static archive on its own. This is the
      # library a downstream links against to run a generated parser (e.g.
      # cedar-lean-ffi). Building it in isolation fails if the runtime/lexer
      # subset stops compiling to native or starts importing generator-only
      # modules (frontend, construction, emit, LSP, bootstrap).
      - name: Build runtime static library
        run: lake build LeanParserGeneratorRuntime:static
      - name: Build parser tests
        run: lake build ParserTests
      - name: Bootstrap agreement test
        run: lake exe lig-bootstrap-test
      - name: Cedar entities corpus test
        run: lake exe cedarentities-corpus-test
      # The Rust backend: the Cedar crate (lexer, trace parser, and the Rust actions of
      # cedar.lig) and the rustactions fixture must compile, and the fixture must parse its samples.
      - name: Build the Cedar Rust crate
        run: cargo build --release --manifest-path test/cedar/rust/Cargo.toml
      - name: Rust actions fixture
        run: cargo run --release --manifest-path test/rustactions/rust/Cargo.toml -- test/rustactions/samples/*.rast
